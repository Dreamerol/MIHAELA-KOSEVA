<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f4f0e9; }
      .icon { fill: none; stroke: #c8936c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-rect { fill: #c8936c; }
      .title { fill: #171717; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; letter-spacing: 0.5px; }
      .subtitle { fill: #171717; font-family: Arial, Helvetica, sans-serif; font-size: 11px; letter-spacing: 0.3px; }
    </style>
  </defs>
  
  <!-- Rounded rectangle background -->
  <rect class="bg" width="200" height="200" rx="16" ry="16"/>
  
  <!-- Bar Chart Icon -->
  <g transform="translate(55, 48)">
    <!-- Baseline -->
    <line class="icon" x1="18" y1="50" x2="62" y2="50"/>
    <!-- Bars -->
    <rect class="icon-rect" x="18" y="38" width="6" height="12"/>
    <rect class="icon-rect" x="30" y="28" width="6" height="22"/>
    <rect class="icon-rect" x="42" y="18" width="6" height="32"/>
    <rect class="icon-rect" x="54" y="32" width="6" height="18"/>
  </g>
  
  <!-- Text -->
  <text class="title" x="100" y="125" text-anchor="middle">STATS</text>
  <text class="subtitle" x="100" y="145" text-anchor="middle">GitHub analytics</text>
</svg>